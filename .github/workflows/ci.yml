name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Check build output
      run: |
        test -f dist/index.js
        test -f dist/index.d.ts
        echo "✅ Build successful"

    - name: Run tests (if test script exists)
      run: npm test || echo "No tests found, skipping"

    - name: Verify CLI
      run: |
        node cli.js info
        node cli.js uuid
        echo "✅ CLI working"

    - name: Check package size
      run: |
        npm pack
        SIZE=$(ls -lh devtools-js-*.tgz | awk '{print $5}')
        echo "Package size: $SIZE"
        if [[ "$SIZE" == *"M"* ]]; then
          echo "⚠️  Package size > 1MB"
        else
          echo "✅ Package size < 1MB"
        fi

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript compilation
      run: npx tsc --noEmit

    - name: Verify no console.log in production code
      run: |
        if grep -r "console.log" src/ --exclude-dir=node_modules; then
          echo "⚠️  Found console.log in source code"
          exit 1
        else
          echo "✅ No console.log in source code"
        fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Create release package
      run: npm pack

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: devtools-js-package
        path: devtools-js-*.tgz

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: devtools-js-*.tgz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}